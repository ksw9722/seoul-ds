import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return
    app.tasks.register('exportRuntimeLicenseInventory') {
        doLast {
            def config = app.configurations.getByName('gitHubProdDebugRuntimeClasspath')
            def modules = config.incoming.resolutionResult.allComponents.findAll { it.id instanceof ModuleComponentIdentifier }.collect { [group: it.id.group, name: it.id.module, version: it.id.version] }
            def view = config.incoming.artifactView { componentFilter { it instanceof ModuleComponentIdentifier } }
            def artifacts = view.artifacts.artifacts.collect { [id: it.id.componentIdentifier.toString(), file: it.file.absolutePath] }
            def output = new File(System.getenv('SEOUL_DS_LICENSE_INVENTORY') ?: new File(gradle.rootProject.rootDir, 'artifacts/runtime-license-inventory.json').absolutePath)
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([configuration: config.name, modules: modules, artifacts: artifacts]))
            println("LICENSE_INVENTORY: " + output.absolutePath + " (" + modules.size() + " modules)")
        }
    }
}
